name: Build SecureNet VPN

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build libwgcore.so + APK + Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: false

      # ---------------------------------------------------------------
      # Missing piece completed here: the real wireguard-go userspace
      # data plane compiled for all 3 Android ABIs (libwgcore.so)
      # ---------------------------------------------------------------
      - name: Build WireGuard-Go native library (libwgcore.so, 3 ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x go/build-wireguard-go.sh
          ./go/build-wireguard-go.sh

      - name: Verify native libraries
        run: |
          echo "libwgcore.so artifacts:"
          ls -la app/src/main/jniLibs/*/libwgcore.so
          file app/src/main/jniLibs/arm64-v8a/libwgcore.so

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK (includes libwgcore.so + libsecurenet.so)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for distribution
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "SecureNetVPN-debug-v${VERSION}.apk"
          ls -la SecureNetVPN-debug-v*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureNetVPN-debug-APK
          path: SecureNetVPN-debug-v*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "SecureNet VPN ${{ github.ref_name }} — Full Build"
          tag_name: ${{ github.ref_name }}
          body: |
            ## SecureNet VPN ${{ github.ref_name }} — Enterprise-Grade Privacy Solution

            **Full production build** — this APK contains the real WireGuard-Go
            data plane (`libwgcore.so`) compiled for `arm64-v8a`, `armeabi-v7a`
            and `x86_64`, plus the native C core (`libsecurenet.so`).

            ### Features
            - **NEW v1.8.17: three guide upgrades — ① a setup-difficulty filter row above the list (فلترة بالصعوبة): All / Beginner / Intermediate / Advanced chips reusing the exact strings of the v1.8.14 card badges, driven by the pure WireGuideFilter.filterByDifficulty and composing with search, the section chips and the free/paid row; ② an in-app 📊 "What's new" release feed (صفحة ما الجديد): the shipped changelog as a bottom sheet, newest first with one bullet per headline feature from v1.8.12 to v1.8.17 — auto-opened once per version (a stored marker remembers the last acknowledged release) and re-openable from a new tools button beside the config checker; ③ the checker UI in 6 additional languages (ترجمة واجهة الفاحص): full wgcheck_* string sets for French, Spanish, German, Turkish, Russian and Urdu with key+placeholder parity validated at generation time, while everything else keeps falling back to EN/AR through standard resource resolution; 7 new JVM tests (WhatsNewTest pins the newest-first ordering, the current-version anchor and the literal release list; the filter tests pin the class partition and its composition with the price filter; 404 total green), zero new dependencies, full EN/AR strings**
            - **NEW v1.8.16: two safety upgrades — ① a fresh-sources alert (تنبيه المصادر الجديدة): the guide remembers which sources you have already been shown and greets every catalog update with a dismissible "🆕 New guide sources in this update (N): …" banner plus a NEW badge on the affected cards, so the 69-source catalog keeps growing without anything slipping past silently (the very first visit records the baseline quietly — the alert only ever fires for genuinely new arrivals); ② an offline WireGuard config checker (🛡️ فاحص إعدادات WireGuard): paste or import any wg-quick .conf and get a line-anchored diagnosis before importing it — missing PrivateKey/Address/PublicKey, malformed base64 keys, broken Address/AllowedIPs CIDRs, bad endpoints (host:port / [ipv6]:port), out-of-range MTU/ListenPort/PersistentKeepalive, unknown or duplicated keys, stray lines, plus an informational note when AllowedIPs = 0.0.0.0/0 means full tunnel — every issue carries severity + line number + the exact token; ~20 explainable rules live in a new pure WireGuardConfigChecker (zero Android APIs, key validation shared with the connection path via KeyUtils), the sheet opens from a new guide-screen button, and the whole thing runs on-device: nothing is uploaded anywhere; 25 new JVM tests (397 total green), zero new dependencies, full EN/AR strings**
            - **NEW v1.8.15: two guide upgrades — ① a Share button (مشاركة) on every catalog card: the card row now reads Open / Copy / Note / Share, and Share fires the system share sheet with the same one-liner the detail page has shared since v1.8.7 (GuideDetail.shareText = "name — url") so a source can be sent to a friend from the list without opening it; ② an interactive setup wizard (معالج الإعداد التفاعلي): the detail page's section tutorial becomes a per-source checklist — every step is a tappable row with a MaterialCheckBox, checked steps get strikethrough + dim, a caption and LinearProgressIndicator answer "3 of 6 steps done" and swap to a completion line when everything is ticked, a Reset link appears only when there is progress to drop, and the whole state persists per source across restarts through the new pure GuideProgress store (InMemory reference + SharedPrefs shell, one StringSet per source under steps_<id>, every write bounds-checked against the array length so stale indices can never surface as phantom checks); 11 new JVM tests for the progress store (bounds rules, toggle round-trips, per-source independence, normalize repair; 372 total green), zero new dependencies, full EN/AR strings**
            - **NEW v1.8.14: every source in the guide now carries a setup-difficulty badge (مؤشر صعوبة الإعداد) — a curated GuideDifficulty class (Beginner/مبتدئ = install an app and sign in, Intermediate/متوسط = a guided script or docker one-liner, Advanced/متقدم = real server/network work) assigned to all 69 sources (section defaults with 20 explicit overrides where reality disagrees: Amnezia deploys a server from one desktop app, GL.iNet runs WireGuard from its firmware UI, Tailscale/NetBird are famously two taps, while Headscale, Netmaker, VyOS, OpenBSD wg(4) stay honest ops projects) — the colored traffic-light badge shows on every catalog card next to the Editor's choice badge, the detail page identity line reads "section · difficulty", the side-by-side comparison gains a Setup-difficulty row so you can weigh effort against price, and the difficulty words are searchable in EN+AR (سهل / متوسط / متقدم) so typing "سهل" from the Arabic list reaches every easy source across all sections; the Favorites chip (⭐ المفضلة) from v1.8.1 stays the way to pin sources; 3 new JVM tests (361 total green), zero new dependencies, full EN/AR strings**
            - **v1.8.13: Mesh section (5 coordination tools), quick free/paid filter chips, side-by-side comparison sheet; pure GuideCompare**
            - **v1.8.12: catalog 60 → 69 verified sources — free AND paid paths for self-hosted and routers, price search keywords (مجاني/مدفوع)**
            - **v1.8.11: Smart-picks home-screen widget with one-tap deep links into source details; pure GuideWidgetModel**
            - **v1.8.10: smart verdicts + reason chips on the detail page and related rows; pure GuideSmart.verdict/siblingReason/sharedKeywords**
            - **v1.8.9: smart layer — Smart-picks card with reason chips, typo-tolerant fuzzy search, smart insights; pure GuideSmart**
            - **v1.8.8: scannable QR of every source's URL on the detail page + glanceable official host; pure GuideDetailQr**
            - **v1.8.7: full per-source detail page — identity, URL open/copy/share, tutorial, your signals, related sources; pure GuideDetail core**
            - **v1.8.6: catalog 52 → 60 verified sources (VPNBook, linuxserver-wireguard, WireHole, Pritunl, pfSense, IPFire, ASUS, NetworkManager)**
            - **v1.8.5: catalog 44 → 52 verified sources (12VPX, Njalla, Cryptostorm, Amnezia, Pro Custodibus, UniFi, FreshTomato, WireSock)**
            - **v1.8.4: catalog 36 → 44 verified sources (RiseupVPN, PureVPN, WireGuard Portal, innernet, defguard, Asuswrt-Merlin, DD-WRT, VyOS)**
            - **v1.8.3: guide statistics card with most-rated ranking, confirm-guarded bulk signal delete, in-app encrypted backup vault (10 restore points)**
            - **v1.8.2: ratings/favorites/notes ride the encrypted backup; Top-rated chip; searchable Editor's-choice badges**
            - WireGuard VPN (wireguard-go via JNI, foreground service, `vpn_channel` notifications)
            - **v1.8.1: star ratings, favorites & searchable personal notes for every source — favorites chip with float-to-top sorting**
            - **v1.8: standalone full-screen guide screen — live search across names/URLs/EN+AR keywords, category filter chips and an illustrated 4-step flow strip**
            - **NEW v1.7.1: Guide expanded to 36 verified sources — new "Routers & firewalls" section (GL.iNet, OpenWrt, pfSense/OPNsense, MikroTik), 3 more paid providers (TorGuard with verified member-area generator, PIA and NordVPN with honest no-official-export notes), 5 more self-hosted/mesh tools (Tailscale free plan, NetBird, Netmaker, Firezone, one-command wireguard-install script), official iOS & macOS clients, per-section step-by-step tutorial cards, collapsible sections and a 6-point tips & troubleshooting card — full EN/AR**
            - **NEW v1.7: Built-in "Where to get WireGuard configs" guide — free sources (Cloudflare WARP via wgcf, Proton free), 13 paid providers with their config-generator links (Mullvad, Windscribe, IVPN, AzireVPN, OVPN, AirVPN, Astrill, hide.me, IPVanish, Surfshark, PrivateVPN, PrivadoVPN, StrongVPN), self-hosted server tools (wg-easy, PiVPN, Algo, Headscale) and official clients — every entry with Open-in-browser + Copy-link actions, full EN/AR, reachable from the import screen**
            - **FIX v1.6.3: Dashboard crash eliminated — the exact stack trace captured by the v1.6.2 crash reporter pinpointed a Kotlin initialisation-order bug (container handle read by an init-time coroutine before its property initializer ran). The handle is now a constructor property and every startup refresh is failure-isolated: no more closing after the first three screens**
            - **NEW v1.6.2: On-screen crash reporter — when the app crashes anywhere, a dedicated report screen (separate process) shows the full stack trace with copy/share buttons, and the next launch offers the same report — no more guessing at field failures**
            - **FIX v1.6.1: Startup crash loop fixed — self-healing encrypted storage (purge + retry + plain fallback) for devices with corrupt AndroidKeyStore or restored/cloned app data, plus a global crash reporter that captures any future failure to a local file**
            - **NEW v1.6: Encrypted log backup — export/import the session log as a passphrase-protected .snback file (PBKDF2 120k + AES-256-GCM), non-destructive merge on restore**
            - **NEW v1.6: Always-on VPN mode — tunnel re-arms after reboot, app launch and swipe-away + per-server usage statistics (time, sessions, failures, share bars)**
            - **NEW v1.5: WireGuard profile import — scan a QR code, open a `.conf` file, or paste the config; export any profile as a scannable QR / PNG**
            - **NEW v1.5: Monthly stats dashboard — stacked daily traffic bar chart, totals, active days, sessions & connected time, month navigation (all on-device, encrypted log)**
            - On-device intelligence: ML threat classifier, Smart Connect server recommender,
              network anomaly detector, composite protection score
            - Local device security scanner (anti-malware, permission risk scoring)
            - Network optimizer (DNS cache + MTU tuning) + built-in speed test
            - Multi-hop chain (Double VPN) + VPN hotspot sharing with leak guard (v1.4)
            - Tor-over-VPN (Orbot) + connection scheduling (v1.3)
            - Split tunneling (allow-only / exclude), Kill switch, auto-connect,
              Quick Settings tile, notification actions
            - Full Arabic + English localization (RTL-aware)
            - Material Design 3, glass-morphism server cards, Lottie animations
            - EncryptedSharedPreferences, WorkManager jobs, HPKP-style pinning

            ### Install
            1. Download `SecureNetVPN-debug-v*.apk`
            2. Enable "Install from unknown sources"
            3. Install and open (Android 11 / API 30+)

            > Built automatically by GitHub Actions from source. Signed with the
            > project debug keystore — for store distribution, replace with your
            > own release keystore.
          files: SecureNetVPN-debug-v*.apk
          fail_on_unmatched_files: true
