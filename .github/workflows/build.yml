name: Build SecureNet VPN

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build libwgcore.so + APK + Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: false

      # ---------------------------------------------------------------
      # Missing piece completed here: the real wireguard-go userspace
      # data plane compiled for all 3 Android ABIs (libwgcore.so)
      # ---------------------------------------------------------------
      - name: Build WireGuard-Go native library (libwgcore.so, 3 ABIs)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          chmod +x go/build-wireguard-go.sh
          ./go/build-wireguard-go.sh

      - name: Verify native libraries
        run: |
          echo "libwgcore.so artifacts:"
          ls -la app/src/main/jniLibs/*/libwgcore.so
          file app/src/main/jniLibs/arm64-v8a/libwgcore.so

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK (includes libwgcore.so + libsecurenet.so)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for distribution
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "SecureNetVPN-debug-v${VERSION}.apk"
          ls -la SecureNetVPN-debug-v*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureNetVPN-debug-APK
          path: SecureNetVPN-debug-v*.apk
          if-no-files-found: error

      - name: Create GitHub Release with APK (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "SecureNet VPN ${{ github.ref_name }} — Full Build"
          tag_name: ${{ github.ref_name }}
          body: |
            ## SecureNet VPN ${{ github.ref_name }} — Enterprise-Grade Privacy Solution

            **Full production build** — this APK contains the real WireGuard-Go
            data plane (`libwgcore.so`) compiled for `arm64-v8a`, `armeabi-v7a`
            and `x86_64`, plus the native C core (`libsecurenet.so`).

            ### Features
            - **NEW v1.8.13: three guide upgrades — ① a dedicated "Mesh networks" (شبكات Mesh) section: the five coordination tools (Headscale, Tailscale, NetBird, Netmaker, Firezone) leave the crowded self-hosted list for their own GuideCategory.MESH section with its own icon, filter chip, tutorial steps and EN/AR section title — a different mental model from running a single wg server, and all five are free software / free personal or community tiers so they carry the free/مجاني price markers; ② a quick free/paid filter as buttons above the list: an independent All/Free/Paid chip row (WireGuideFilter.filterByPrice + priceOf deriving each source's class from its category plus the curated price markers) so one tap on "مجاني" reaches every free option across all sections without typing; ③ side-by-side comparison (مقارنة جنباً إلى جنب): a Compare button on every detail page opens a searchable picker (same-section sources lead, then shared catalog keywords, then the user's own signals) and renders a two-column table — section, price, official host, Editor's choice badge, your rating, bookmark — with a shared-keywords footer speaking the smart layer's vocabulary (Sweden links Mullvad/AzireVPN/OVPN), both name headers tapping into the full detail page; the pure GuideCompare engine (compare + candidates, deterministic, zero Android imports) is covered by 11 new JVM tests plus 3 new filter tests and a catalog mesh-section test (358 total green), zero new dependencies, full EN/AR strings**
            - **NEW v1.8.12: the guide's self-hosted and router/firewall sections now explicitly cover free AND paid paths — self-hosted: WGDashboard (free open-source web dashboard for an existing server, peers + QR + .conf downloads), the githubixx Ansible WireGuard role (free configuration-as-code for fleets), Oracle Cloud Always Free (a genuinely free VPS tier — the free-steps text already pointed there, now it has its own entry with an honest note) and Hetzner Cloud (the paid homelab-favorite VPS); routers & firewalls: OpenBSD wg(4) (free, kernel-native, the most security-audited firewall OS), Firewalla Gold/Purple (paid consumer firewall appliance with WireGuard server + client), Netgate pfSense+ appliances (paid pfSense hardware, free-CE disclosed), Keenetic (paid routers with WireGuard built into KeeneticOS 3.3+) and Turris Omnia (paid open-source-first router by CZ.NIC) — every new entry's URL verified reachable and carries EN+AR search keywords including explicit price markers (free/مجاني, paid/مدفوع) so searching "مجاني" or "paid" now surfaces them across sections; 9 new entries (60 → 69: self-hosted 17 → 21, routers 12 → 17), 1 new JVM catalog test (343 total green), zero new dependencies, full EN/AR strings**
            - **NEW v1.8.11: the smart layer reaches the home screen — a "Smart picks" app widget showing up to three recommended sources (name + the same reason chip the guide card uses: "matches your most-engaged category" / "Editor's pick you haven't rated yet" / "trusted starting point" / "similar to what you're viewing"), each row tapping straight into that source's detail page through the new MainActivity.EXTRA_OPEN_GUIDE_DETAIL contract (singleTask routing: onCreate for cold starts, onNewIntent for relaunches, extra consumed so recreation never re-opens), the title opening the app, and a "rate a few sources" hint when nothing scores — the widget is never blank and never invents picks; refresh is honest by construction: system onUpdate + 30-min periodic floor plus pushUpdate from MainActivity.onResume so every signal change (stars, favorites, notes, backup restore) repaints placed widgets the moment the app is foregrounded; new pure GuideWidgetModel view-model (rows + explicit empty state, deterministic, zero Android imports) covered by 9 new JVM tests (342 total green), zero new dependencies, full EN/AR strings**
            - **NEW v1.8.10: the detail page gets its own smart layer — a personalized verdict line right under the identity card ("✦ Fits your most-engaged category: Paid · 3 signals" when the source lives in the category your ratings/favorites/notes cluster in, else "✦ Editor's pick you haven't rated yet — worth a look" for an unrated badged source, hidden entirely when nothing data-grounded applies so the page never invents praise); and every row in "more in this category" now explains itself with a smart reason chip — "similar to what you're viewing" when the sibling shares catalog keywords with the current source (same brand family, jurisdiction like Sweden for Mullvad/AzireVPN, tech like mesh for Tailscale/NetBird/NetMaker or Docker for WG-Easy/LinuxServer), else "Editor's pick you haven't rated yet" for an unrated badged sibling, else silence — new pure GuideSmart.verdict + siblingReason + sharedKeywords (symmetric keyword intersection) covered by 13 new JVM tests (333 total green) including two catalog-wide sweeps over every same-category pair and every verdict, zero new dependencies, full EN/AR strings**
            - **NEW v1.8.9: the guide gets a smart layer — "Smart picks for you" card (up to three sources scored 2× from how many of your signals — stars, favorites, notes — live in each source's category, +1 for an unrated Editor's-choice pick, never recommending what you already bookmarked, each pick carrying a reason chip that names why it surfaced: "matches your most-engaged category" / "Editor's pick you haven't rated yet" / "trusted starting point" for the cold start); typo-tolerant search fallback with the same all-tokens-must-hit AND semantics — when exact matching finds nothing the guide retries with Levenshtein edit-distance matching (≤2 for 4+ char tokens, ≤1 for 3-char, exact-only for shorter) so "wirguard" still finds WireGuard under a "no exact match — closest matches" hint; and smart insights inside the statistics card ("Most-engaged category: X · N signals", "N sources there are still unrated — try them"); new pure GuideSmart object (recommendations + fuzzy + insights + exposed levenshtein) covered by 11 new JVM tests (320 total green), zero new dependencies, full EN/AR strings**
            - **NEW v1.8.8: detail pages gain a scannable QR — every source's official URL is rendered as a medium-error-correction QR code right inside the link card (white-on-dark guaranteed contrast, tap the code to open the link here, regenerated when hopping between related siblings), and the bare official host ("nordvpn.com", "www." stripped) is printed under the code as a glanceable trust signal; pure GuideDetailQr encoder + GuideDetail.hostOf covered by 8 new JVM tests (309 total green) including catalog-wide passes that fail the build if any of the 60 source URLs stops being encodable or parseable, reuses the zxing core already shipped since v1.5 (zero new dependencies), full EN/AR strings**
            - **NEW v1.8.7: per-source detail page — every card in the guide (list, search results and the statistics ranking) now opens a full detail screen answering everything about a source at a glance: identity header (category icon + name + category label + Editor's-choice badge + favorite heart), the selectable URL with open / copy / share actions, the full description with the editorial small-print note, the category's step-by-step tutorial so the page stands alone, a "your signals" card with the big interactive star row and personal-note add/edit/remove (the exact same widgets the cards use, so tap-to-clear stars and LTR-forced star order behave identically), and "more in this category" — up to five same-category siblings ranked by the user's own signals (favorites → stars → Editor's choice) where tapping one swaps the screen in place for natural category hopping; new pure GuideDetail core (facts merge, related ranking, share text) covered by 8 new JVM tests (301 total green), graceful unknown-id path for catalog drift after restores, quick bottom sheet jumps to detail too, full EN/AR strings**
            - **NEW v1.8.6: Guide expands from 52 to 60 verified sources — free gains VPNBook (public no-signup WireGuard configs in five countries, honest 7-day expiry note); self-hosted grows to 17 with the linuxserver/wireguard Docker image (server + web UI + client tunnels), WireHole (WireGuard + Pi-hole + Unbound stack) and Pritunl (distributed VPN server with WireGuard mode, honest Pritunl-client-auth note); routers reaches 12 platforms with pfSense (official Netgate docs), IPFire (native WireGuard in the web GUI) and ASUS stock firmware (VPN Fusion, firmware-388 model note); and a new Apps pick, NetworkManager (WireGuard built into every modern desktop Linux, verified against Red Hat's official RHEL 9 guide) — every URL checked against official docs/GitHub at release time, EN+AR search keywords for all eight, 1 new test (293 total green), full EN/AR**
            - **NEW v1.8.5: Guide expands from 44 to 52 verified sources — the paid generators section reaches 20 with 12VPX (ready-made config ZIPs per location), Njalla (privacy collective, "Use WireGuard" → download .conf, one-active-config note) and Cryptostorm (token-based generator with a Simple/Advanced mode that keeps your private key on-device); self-hosted grows to 14 with Amnezia (open-source client that installs WireGuard or the block-resistant AmneziaWG fork on your own VPS and exports plain .conf files) and Pro Custodibus (web console with monitoring, peer expiry alerts and QR codes); routers reaches 9 platforms with Ubiquiti UniFi gateways (official help article: built-in WireGuard server + client) and FreshTomato (official wiki verified, honest ARM-only note); and a new Apps pick, WireSock Secure Connect for Windows (third-party client with kill switch and split tunneling, free for personal use) — every URL checked against official docs/GitHub at release time, EN+AR search keywords for all eight, 1 new test (292 total green), full EN/AR**
            - **NEW v1.8.4: Guide expands from 36 to 44 verified sources — a new free option (RiseupVPN with its community config generator and an honest note that the official client doesn't export .conf), PureVPN joins the paid generators (official member-area WireGuard add-on, verified), the self-hosted section grows to 12 with WireGuard Portal (1.8k★ web admin with QR + LDAP), innernet (Rust overlay mesh) and defguard (self-hosted WireGuard with MFA), and the router section nearly doubles to 7 platforms with Asuswrt-Merlin (honest Wi-Fi 6/7 hardware note), DD-WRT and VyOS (official WireGuard docs verified) — every new URL checked against official docs/GitHub at release time, search keywords in EN+AR, 1 new test (291 total green), full EN/AR**
            - **NEW v1.8.3: Guide statistics + bulk delete + multiple in-app backups — the guide gains a statistics card headed by the “most rated sources” ranking (top 5 by stars, ♥ favorites marked, Editor's-choice entries breaking ties) with rated/average/favorites/notes counts and the star distribution; a “Clear all signals” action wipes every rating, favorite and personal note after a confirmation dialog that spells out the exact counts; and a new in-app backup vault keeps up to 10 encrypted restore points inside SecureNet — same SNBK container (PBKDF2 120k + AES-256-GCM) with guide signals included, create / restore (non-destructive merge of events + signals) / delete (confirmed) without ever leaving the app; also fixes a latent bug where the backup passphrase prompt could never reach the settings screen — full EN/AR**
            - **NEW v1.8.2: Guide ratings & notes travel in the encrypted backup + Top-rated sort + Editor's choice badges — the .snback container now carries your guide star ratings, favorites and personal notes inside its encrypted header (PBKDF2 120k + AES-256-GCM), restored non-destructively (the backup fills the gaps, values you already have win) with older backups still fully compatible; a new “Top rated” chip shows the whole catalog as one flat list ordered by favorites → stars → reliability; and the 10 most reliable sources (official WireGuard clients, audited providers Mullvad/IVPN/Proton, top-maintained self-host tools wg-easy/PiVPN/Tailscale, OpenWrt) wear an amber “Editor's choice” badge that is also searchable (editor / موثوق / اختيار المحرر) — full EN/AR**
            - WireGuard VPN (wireguard-go via JNI, foreground service, `vpn_channel` notifications)
            - **NEW v1.8.1: Star ratings, favorites & personal notes for every guide source — tap 1–5 stars on any card (tap again to clear), heart-bookmark favorite sources (they float to the top of every list) and a new Favorites chip filters the guide to bookmarks only, write a searchable private note per source (edit/remove via dialog) — all signals persist locally (SharedPreferences, plain-text prefs by design) and work in both the full-screen guide and the import dialog's quick sheet — full EN/AR**
            - **NEW v1.8: Standalone guide screen — "Where to get WireGuard configs" now opens full-screen from Settings with LIVE SEARCH across names, URLs and EN+AR keywords (مجاني / مدفوع work too), category filter chips (All / Free / Paid / Self-hosted / Routers / Apps), and an illustrated 4-step flow strip (choose source → generate .conf → import → connect) — the import dialog's quick sheet gains the same rendering plus a jump link to the full screen**
            - **NEW v1.7.1: Guide expanded to 36 verified sources — new "Routers & firewalls" section (GL.iNet, OpenWrt, pfSense/OPNsense, MikroTik), 3 more paid providers (TorGuard with verified member-area generator, PIA and NordVPN with honest no-official-export notes), 5 more self-hosted/mesh tools (Tailscale free plan, NetBird, Netmaker, Firezone, one-command wireguard-install script), official iOS & macOS clients, per-section step-by-step tutorial cards, collapsible sections and a 6-point tips & troubleshooting card — full EN/AR**
            - **NEW v1.7: Built-in "Where to get WireGuard configs" guide — free sources (Cloudflare WARP via wgcf, Proton free), 13 paid providers with their config-generator links (Mullvad, Windscribe, IVPN, AzireVPN, OVPN, AirVPN, Astrill, hide.me, IPVanish, Surfshark, PrivateVPN, PrivadoVPN, StrongVPN), self-hosted server tools (wg-easy, PiVPN, Algo, Headscale) and official clients — every entry with Open-in-browser + Copy-link actions, full EN/AR, reachable from the import screen**
            - **FIX v1.6.3: Dashboard crash eliminated — the exact stack trace captured by the v1.6.2 crash reporter pinpointed a Kotlin initialisation-order bug (container handle read by an init-time coroutine before its property initializer ran). The handle is now a constructor property and every startup refresh is failure-isolated: no more closing after the first three screens**
            - **NEW v1.6.2: On-screen crash reporter — when the app crashes anywhere, a dedicated report screen (separate process) shows the full stack trace with copy/share buttons, and the next launch offers the same report — no more guessing at field failures**
            - **FIX v1.6.1: Startup crash loop fixed — self-healing encrypted storage (purge + retry + plain fallback) for devices with corrupt AndroidKeyStore or restored/cloned app data, plus a global crash reporter that captures any future failure to a local file**
            - **NEW v1.6: Encrypted log backup — export/import the session log as a passphrase-protected .snback file (PBKDF2 120k + AES-256-GCM), non-destructive merge on restore**
            - **NEW v1.6: Always-on VPN mode — tunnel re-arms after reboot, app launch and swipe-away + per-server usage statistics (time, sessions, failures, share bars)**
            - **NEW v1.5: WireGuard profile import — scan a QR code, open a `.conf` file, or paste the config; export any profile as a scannable QR / PNG**
            - **NEW v1.5: Monthly stats dashboard — stacked daily traffic bar chart, totals, active days, sessions & connected time, month navigation (all on-device, encrypted log)**
            - On-device intelligence: ML threat classifier, Smart Connect server recommender,
              network anomaly detector, composite protection score
            - Local device security scanner (anti-malware, permission risk scoring)
            - Network optimizer (DNS cache + MTU tuning) + built-in speed test
            - Multi-hop chain (Double VPN) + VPN hotspot sharing with leak guard (v1.4)
            - Tor-over-VPN (Orbot) + connection scheduling (v1.3)
            - Split tunneling (allow-only / exclude), Kill switch, auto-connect,
              Quick Settings tile, notification actions
            - Full Arabic + English localization (RTL-aware)
            - Material Design 3, glass-morphism server cards, Lottie animations
            - EncryptedSharedPreferences, WorkManager jobs, HPKP-style pinning

            ### Install
            1. Download `SecureNetVPN-debug-v*.apk`
            2. Enable "Install from unknown sources"
            3. Install and open (Android 11 / API 30+)

            > Built automatically by GitHub Actions from source. Signed with the
            > project debug keystore — for store distribution, replace with your
            > own release keystore.
          files: SecureNetVPN-debug-v*.apk
          fail_on_unmatched_files: true
